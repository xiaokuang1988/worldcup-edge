name: Update kt jingcai snapshot data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build kt jingcai snapshot data
        run: node scripts/scrape-kt-jingcai.mjs --from-file
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kt-jingcai-current.json docs/data/live-matches.json outputs/data/live-matches.json
          git diff --cached --quiet || git commit -m "Update kt jingcai snapshot data"
          git push
